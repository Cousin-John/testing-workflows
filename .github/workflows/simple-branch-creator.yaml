name: Branch and Command Executor

on:
  workflow_dispatch:
    inputs:
      baseBranch:
        description: 'Base branch to create new branch from'
        required: true
        default: 'dev'
      newBranch:
        description: 'Name of the new branch to be created'
        required: true
        default: 'test-branch'
      command:
        description: 'Command to execute'
        required: true
        default: 'echo "test" > test.txt'

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.baseBranch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate random branch name
        id: branch-name
        run: |
          RANDOM_SUFFIX=$(openssl rand -hex 4)
          echo "branch_name=${{ github.event.inputs.newBranch }}-$RANDOM_SUFFIX" >> $GITHUB_OUTPUT

      - name: Create and switch to new branch
        run: |
          git config --global user.name 'Lawlabs Bot'
          git config --global user.email 'bot@lawlabs.ca'
          git checkout -b ${{ steps.branch-name.outputs.branch_name }}

      - name: Execute command
        id: execute-command
        run: |
          COMMAND=$(printf '%q' "${{ github.event.inputs.command }}")
          echo "Executing command: $COMMAND"
          echo "command_input<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          output=$(eval "$COMMAND" 2>&1)  # Capture both stdout and stderr
          echo "Command output:"
          echo "$output"
          echo "$output" > command_output.txt
          echo "command_output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        id: commit
        run: |
          # NOTE: this is done to avoid issues with special characters in the command... printf offers a way to escape special characters
          COMMIT_MSG=$(printf '%q' "Execute command: ${{ github.event.inputs.command }}")
          git add .
          if git commit -m "$COMMIT_MSG"; then
            echo "commit_success=true" >> $GITHUB_OUTPUT
            git push origin ${{ steps.branch-name.outputs.branch_name }}
          else
            echo "commit_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.commit.outputs.commit_success == 'true'
        id: create-pr
        run: |
          gh auth login --with-token <<< "${{ secrets.PAT_TOKEN }}"
          COMMAND_INPUT="${{ steps.execute-command.outputs.command_input }}"
          # Truncate command input to the first 100 characters for the title
          TRUNCATED_COMMAND="${COMMAND_INPUT:0:100}"
          # Add ellipsis if the command was actually truncated
          if [ ${#COMMAND_INPUT} -gt 100 ]; then
            TRUNCATED_COMMAND="${TRUNCATED_COMMAND}..."
          fi
          
          PR_TITLE="Execute command: $TRUNCATED_COMMAND"

          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "Automated PR created by GitHub Actions workflow" \
            --base "${{ github.event.inputs.baseBranch }}" \
            --head "${{ steps.branch-name.outputs.branch_name }}" \
            --assignee "${{ github.actor }}")
          
          PR_NUMBER=$(basename "$PR_URL")
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Add command output as PR comment
        if: steps.commit.outputs.commit_success == 'true'
        run: |
          COMMENT_BODY="Command executed:
          \`\`\`bash
          ${{ steps.execute-command.outputs.command_input }}
          \`\`\`

          Command output:
          \`\`\`
          $(cat command_output.txt)
          \`\`\`"
          gh pr comment ${{ steps.create-pr.outputs.pr_number }} --body "$COMMENT_BODY"

