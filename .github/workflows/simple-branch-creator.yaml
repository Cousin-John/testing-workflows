name: Branch and Command Executor

on:
  workflow_dispatch:
    inputs:
      baseBranch:
        description: 'Base branch to create new branch from'
        required: true
        default: 'dev'
      newBranch:
        description: 'Name of the new branch to be created'
        required: true
        default: 'test-branch'
      command:
        description: 'Command to execute'
        required: true
        default: 'echo "test" > test.txt'

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.baseBranch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate random branch name
        id: branch-name
        run: |
          RANDOM_SUFFIX=$(openssl rand -hex 4)
          echo "branch_name=${{ github.event.inputs.newBranch }}-$RANDOM_SUFFIX" >> $GITHUB_OUTPUT

      - name: Create and switch to new branch
        run: |
          git config --global user.name 'Lawlabs Bot'
          git config --global user.email 'bot@lawlabs.ca'
          git checkout -b ${{ steps.branch-name.outputs.branch_name }}

      - name: Execute command
        id: execute-command
        run: |
          echo "Executing command: ${{ github.event.inputs.command }}"
          output=$(${{ github.event.inputs.command }})
          echo "Command output:"
          echo "$output"
          echo "command_output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        id: commit
        run: |
          git add .
          COMMIT_MSG="Execute command: ${{ github.event.inputs.command }}"
          if git commit -m "$COMMIT_MSG"; then
            echo "commit_success=true" >> $GITHUB_OUTPUT
            git push origin ${{ steps.branch-name.outputs.branch_name }}
          else
            echo "commit_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.commit.outputs.commit_success == 'true'
        id: create-pr
        run: |
          gh auth login --with-token <<< "${{ secrets.PAT_TOKEN }}"
          PR_URL=$(gh pr create \
            --title "Execute command: ${{ github.event.inputs.command }}" \
            --body "Automated PR created by GitHub Actions workflow" \
            --base "${{ github.event.inputs.baseBranch }}" \
            --head "${{ steps.branch-name.outputs.branch_name }}" \
            --assignee "${{ github.actor }}")
          
          PR_NUMBER=$(basename "$PR_URL")
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Add command output as PR comment
        if: steps.commit.outputs.commit_success == 'true'
        run: |
          gh pr comment ${{ steps.create-pr.outputs.pr_number }} --body "Command executed:
          \`\`\`bash
          ${{ github.event.inputs.command }}
          \`\`\`

          Command output:
          \`\`\`
          ${{ steps.execute-command.outputs.command_output }}
          \`\`\`"

